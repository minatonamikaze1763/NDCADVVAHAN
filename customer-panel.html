<!doctype html>
<html lang="en">
  <head>
  <script src="offer-code.js" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <meta name="color-scheme" content="dark" />

    <title>Customer Portal | Next Dimension Customs</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="customer-trust.css?v=20261106-company" />

    <script src="auth.js?v=20261108-device-names" defer></script>
    <script src="plan-catalog.js" defer></script>
    <script src="customer-panel.js?v=20261108-device-names" defer></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="email-tools.js" defer></script>
    <link rel="stylesheet" href="offer-code.css">
<link rel="stylesheet" href="customer-mobile.css?v=20261108-device-names" />
</head>

  <body>
    <div class="ndc-portal-overlay">
      <div class="ndc-portal-shell">
        <!-- SIDEBAR -->
        <aside class="ndc-sidebar" id="ndcNavigation">
<button type="button" id="ndcMenuClose" class="ndc-menu-close" aria-label="Close menu">✕</button>
          <div class="ndc-sidebar-brand">
            <img src="logo.png" alt="NDC logo" class="ndc-brand-logo" width="44" height="44" />

            <div>
              <b>NEXT DIMENSION</b>
              <small>CUSTOMER PORTAL</small>
            </div>
          </div>

          <div class="ndc-sidebar-label">ACCOUNT</div>

          <nav class="ndc-side-nav" aria-label="Customer dashboard navigation">
            <button type="button" data-section="overview" class="is-active">
              <span>◫</span>
              Overview
            </button>

            <button type="button" data-section="profile">
              <span>◎</span>
              My Profile
            </button>

            <button type="button" data-section="setup">
              <span>↗</span>Setup guide
            </button>

            <button type="button" data-section="subscription">
              <span>◇</span>
              Subscription
            </button>

            <button type="button" data-section="payments">
              <span>▤</span>
              Payments
            </button>

            <button type="button" data-section="sessions">
              <span>⌁</span>
              Active Sessions
            </button>

            <button type="button" data-section="features">
              <span>✧</span>
              Features & Access
            </button>

            <button type="button" data-section="security">
              <span>⬡</span>
              Security & Status
            </button>
<button type="button" data-section="contact"><span>✉</span>Contact</button>
<button type="button" data-menu-logout><span>↪</span>Sign out</button>
          </nav>

          <div class="ndc-sidebar-bottom">
            <div class="ndc-support-card">
              <b>Need assistance?</b>
              <span>Contact NDC support for billing or account help.</span>

              <a
                href="https://wa.me/919052691719"
                target="_blank"
                rel="noopener noreferrer"
              >
                Contact support ↗
              </a>
            </div>
          </div>
        </aside>

<button type="button" id="ndcMenuBackdrop" class="ndc-menu-backdrop" aria-label="Close menu" hidden></button>
        <!-- MAIN DASHBOARD -->
        <main class="ndc-portal-main">
          <header class="ndc-portal-topbar">
<img src="logo.png" alt="NDC logo" class="ndc-mobile-logo" width="40" height="40" />
            <div>
              <span class="ndc-eyebrow">NEXT DIMENSION CUSTOMS</span>
              <b id="ndcCustomerWelcome">Welcome back</b>
            </div>

<button type="button" id="ndcMenuToggle" class="ndc-menu-toggle" aria-controls="ndcNavigation" aria-expanded="false">☰ Menu</button>
            <div class="ndc-topbar-right">
              <span class="ndc-secure-label"> ● Secure session </span>

              <a href="index.html" class="ndc-home-button"> Website </a>

              <button
                type="button"
                id="ndcLogoutButton"
                class="ndc-logout-button"
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M9 5H5v14h4M14 8l4 4-4 4M9 12h9" />
                </svg>
                Sign out
              </button>
            </div>
          </header>

          <!-- DASHBOARD CONTENT -->
          <div id="ndcDashboardContent" class="ndc-dashboard-content">
            <div class="ndc-loading">
              <span class="ndc-spinner"></span>
              Loading your account…
            </div>
          </div>

          <footer class="ndc-portal-footer">
            © <span id="ndcPortalYear"></span>
            Next Dimension Customs
          </footer>
        </main>
      </div>
    </div>
  </body>
</html>
