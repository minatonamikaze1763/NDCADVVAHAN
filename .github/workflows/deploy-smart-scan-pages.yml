name: Build NDC Smart Scan Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upload/smart-scan/package-lock.json
      - name: Install browser OCR dependencies
        working-directory: upload/smart-scan
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Prepare same-origin browser assets
        working-directory: upload/smart-scan
        run: npm run setup-assets
      - name: Stage the complete static website without repository metadata
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil

          source = Path(".")
          site = Path("_site")
          excluded_dirs = {".git", ".github", "node_modules", "_site"}
          excluded_files = {"AGENTS.md", ".gitignore", ".npmrc"}
          excluded_paths = {
              "upload/smart-scan/package.json",
              "upload/smart-scan/package-lock.json",
              "upload/smart-scan/setup-assets.cjs",
              "upload/smart-scan/README.md",
          }
          for item in source.rglob("*"):
              relative = item.relative_to(source)
              if any(part in excluded_dirs for part in relative.parts):
                  continue
              if relative.as_posix() in excluded_paths or item.name in excluded_files:
                  continue
              if item.name == ".env" or item.name.startswith(".env."):
                  continue
              target = site / relative
              if item.is_dir():
                  target.mkdir(parents=True, exist_ok=True)
              elif item.is_file():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(item, target)
          (site / ".nojekyll").touch()
          PYCODE
          test -f _site/CNAME
          test -f _site/upload/smart-scan/assets/tesseract/worker.min.js
          test -f _site/upload/smart-scan/assets/tesseract/tesseract-core.wasm
          test -f _site/upload/smart-scan/assets/models/eng.traineddata.gz
          test -f _site/upload/smart-scan/assets/pdfjs/pdf.worker.mjs
          test -f _site/index.html
          test -f _site/upload/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
