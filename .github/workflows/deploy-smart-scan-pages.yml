name: Build NDC Smart Scan Pages
on:
  push:
    branches: [main]
    paths:
      - "upload/**"
      - ".github/workflows/deploy-smart-scan-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upload/smart-scan/package.json
      - name: Install browser OCR dependencies
        working-directory: upload/smart-scan
        run: npm install --omit=dev --no-audit --no-fund
      - name: Prepare same-origin browser assets
        working-directory: upload/smart-scan
        run: npm run setup-assets
      - name: Remove installed npm package tree from the static artifact
        run: rm -rf upload/smart-scan/node_modules upload/smart-scan/package-lock.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
