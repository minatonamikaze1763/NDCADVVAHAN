name: Build NDC Smart Scan Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upload/smart-scan/package-lock.json
      - name: Install browser OCR dependencies
        working-directory: upload/smart-scan
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Prepare same-origin browser assets
        working-directory: upload/smart-scan
        run: npm run setup-assets
      - name: Stage the complete static website without repository metadata
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='AGENTS.md' \
            --exclude='_site/' \
            --exclude='upload/smart-scan/package.json' \
            --exclude='upload/smart-scan/package-lock.json' \
            --exclude='upload/smart-scan/setup-assets.cjs' \
            --exclude='upload/smart-scan/README.md' \
            ./ _site/
          touch _site/.nojekyll
          test -f _site/CNAME
          test -f _site/upload/smart-scan/assets/tesseract/worker.min.js
          test -f _site/upload/smart-scan/assets/tesseract/tesseract-core.wasm
          test -f _site/upload/smart-scan/assets/models/eng.traineddata.gz
          test -f _site/upload/smart-scan/assets/pdfjs/pdf.worker.mjs
          test -f _site/index.html
          test -f _site/upload/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
